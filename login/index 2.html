<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Log In - Skorch</title>
    <meta http-equiv="X-Frame-Options" content="DENY">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(ellipse at top, rgba(177,31,36,0.15) 0%, transparent 50%), var(--bg-base);
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
        }
        .login-logo {
            display: block;
            height: 60px;
            margin: 0 auto 2rem;
        }
        .login-title {
            font-family: 'Inter Tight', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .login-sub a {
            color: var(--brand-red);
            text-decoration: none;
            font-weight: 600;
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-default);
        }
        .login-forgot {
            display: block;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: 1.5rem;
            transition: color 0.15s;
        }
        .login-forgot:hover { color: var(--text-primary); }
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .login-footer a {
            color: var(--brand-red);
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .login-page { padding: 1rem; }
            .login-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="site-nav">
        <div class="site-nav__inner">
            <a href="/" class="site-nav__logo"><img src="/assets/logo.svg" alt="Skorch"></a>
            <div class="site-nav__links">
                <a href="/play" class="site-nav__link">Play</a>
                <a href="/leaderboard" class="site-nav__link">Leaderboard</a>
                <a href="/rules" class="site-nav__link">Rules</a>
            </div>
            <div class="site-nav__right">
                <a href="/register" class="site-nav__auth-btn">Sign Up</a>
                <button class="site-nav__hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
                    <span class="site-nav__hamburger-line"></span>
                    <span class="site-nav__hamburger-line"></span>
                    <span class="site-nav__hamburger-line"></span>
                </button>
            </div>
        </div>
        <div class="site-nav__mobile" id="mobile-menu">
            <a href="/play" class="site-nav__mobile-link">Play</a>
            <a href="/leaderboard" class="site-nav__mobile-link">Leaderboard</a>
            <a href="/rules" class="site-nav__mobile-link">Rules</a>
            <a href="/register" class="site-nav__mobile-link">Sign Up</a>
        </div>
    </nav>
    <div class="site-nav__overlay" id="nav-overlay"></div>

    <div class="login-page">
        <div class="login-card">
            <img src="/assets/logo.svg" alt="Skorch" class="login-logo">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-sub">Log in to play, track stats, and climb the ranks.</p>

            <div class="form-group">
                <label class="form-label" for="login-user">Username</label>
                <input class="form-input" type="text" id="login-user" placeholder="Enter your username" autocapitalize="none" autocorrect="off">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-pass">Password</label>
                <input class="form-input" type="password" id="login-pass" placeholder="Enter your password">
            </div>

            <button class="btn btn-primary btn-lg" id="login-btn" style="width:100%;">Log In</button>

            <div id="login-error" style="color:var(--danger);font-size:0.85rem;text-align:center;min-height:1.25rem;margin-top:0.75rem;"></div>

            <a href="/forgot-password" class="login-forgot">Forgot your password?</a>

            <div class="login-footer">
                New to Skorch? <a href="/register">Create an account</a>
            </div>
        </div>
    </div>

    <script src="/js/site.js?v=6"></script>
    <script>
        document.getElementById('login-btn').addEventListener('click', async function() {
            var username = document.getElementById('login-user').value.trim();
            var password = document.getElementById('login-pass').value;
            var errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            if (!username || !password) { errorEl.textContent = 'Fill in all fields'; return; }
            this.textContent = 'Logging in...';
            this.disabled = true;
            try {
                var res = await fetch('/server/php/api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();
                if (data.success) {
                    var returnTo = new URLSearchParams(window.location.search).get('return') || '/';
                    window.location.href = returnTo;
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    this.textContent = 'Log In';
                    this.disabled = false;
                }
            } catch (e) {
                errorEl.textContent = 'Connection error. Try again.';
                this.textContent = 'Log In';
                this.disabled = false;
            }
        });
        document.getElementById('login-pass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });
    </script>
</body>
</html>
