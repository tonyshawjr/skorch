<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Leaderboard - Skorch</title>
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="description" content="Skorch leaderboard - see who reigns as the Skorch King. Top players ranked by wins, win rate, and games played.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="/css/styles.css?v=5" rel="stylesheet">
</head>
<body>

    <!-- Nav -->
    <nav class="site-nav">
        <div class="site-nav__inner">
            <a href="/" class="site-nav__logo"><img src="/assets/logo.svg" alt="Skorch"></a>
            <div class="site-nav__links">
                <a href="/play" class="site-nav__link">Play</a>
                <a href="/leaderboard" class="site-nav__link is-active">Leaderboard</a>
                <a href="/rules" class="site-nav__link">Rules</a>
            </div>
            <div class="site-nav__right">
                <a href="/login" class="site-nav__auth-btn" id="nav-auth">Log In</a>
                <button class="site-nav__hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
                    <span class="site-nav__hamburger-line"></span>
                    <span class="site-nav__hamburger-line"></span>
                    <span class="site-nav__hamburger-line"></span>
                </button>
            </div>
        </div>
        <div class="site-nav__mobile" id="mobile-menu">
            <a href="/play" class="site-nav__mobile-link">Play</a>
            <a href="/leaderboard" class="site-nav__mobile-link">Leaderboard</a>
            <a href="/rules" class="site-nav__mobile-link">Rules</a>
        </div>
    </nav>
    <div class="site-nav__overlay" id="nav-overlay"></div>

    <!-- Page Header -->
    <section class="page-header">
        <h1 class="page-title">&#127942; Leaderboard</h1>
        <p class="page-sub">The best Skorch players, ranked by wins.</p>

        <div class="search-bar-wrap" id="search-wrap">
            <input type="text" class="search-input" id="player-search" placeholder="Search players..." autocomplete="off">
            <div class="search-results" id="search-results" style="display:none;"></div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All Time</button>
            <button class="filter-tab" data-filter="month">This Month</button>
            <button class="filter-tab" data-filter="week">This Week</button>
        </div>
    </section>

    <!-- Content -->
    <main class="content">

        <!-- Skorch King Spotlight -->
        <div class="king-card" id="king-section">
            <div id="king-content">
                <div class="king-crown">&#128081;</div>
                <div class="shimmer" style="width:160px;height:1.5rem;margin:0.5rem auto;"></div>
                <div class="shimmer" style="width:200px;height:1rem;margin:0.5rem auto;"></div>
            </div>
        </div>

        <!-- Rankings Table -->
        <div class="rankings-card">
            <div id="rankings-content">
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
                <div class="shimmer"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-motto">A Game for the Masses</p>
        <p>&copy; 2017-<script>document.write(new Date().getFullYear())</script> Tony Shaw. All rights reserved.</p>
    </footer>

    <script src="/js/site.js?v=5"></script>
</body>
</html>
